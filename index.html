<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - UMG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4 text-center fw-bold">Catálogo de Productos</h1>
        
        <div class="row" id="contenedor-productos">
            <!-- Productos dinámicos -->
        </div>

        <hr class="my-5">

        <h2 class="mb-3 fw-bold">Carrito de Compras</h2>
        <div id="contenedor-carrito" class="table-responsive bg-white p-3 rounded shadow-sm">
            <table class="table table-striped align-middle mb-3">
                <thead class="table-dark">
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-carrito">
                    <!-- Ítems del carrito -->
                </tbody>
                <tfoot>
                    <tr class="table-secondary fw-bold fs-5">
                        <td colspan="2" class="text-end">Total:</td>
                        <td colspan="2" id="total-carrito" class="text-primary">$0.00</td>
                    </tr>
                </tfoot>
            </table>
            <button class="btn btn-danger" onclick="vaciarCarrito()">Vaciar Carrito</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                const productos = await res.json();
                const contenedor = document.getElementById('contenedor-productos');
                contenedor.innerHTML = '';

                if (productos.length === 0) {
                    contenedor.innerHTML = '<p class="text-center text-muted">No hay productos disponibles.</p>';
                    return;
                }

                productos.forEach(p => {
                    const imagenUrl = (p.imagen && p.imagen.startsWith('http')) 
                        ? p.imagen 
                        : `https://picsum.photos/seed/${p.idProducto}/300/200`;

                    contenedor.innerHTML += `
                        <div class="col-md-3 mb-4">
                            <div class="card h-100 shadow-sm">
                                <img src="${imagenUrl}" class="card-img-top" style="height: 180px; object-fit: cover;">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title fs-6 fw-bold">${p.nombre}</h5>
                                    <p class="card-text text-muted small">${p.codigo}</p>
                                    <h6 class="mt-auto text-primary fw-bold">$${Number(p.precio).toFixed(2)}</h6>
                                    <button class="btn btn-success mt-2" onclick="agregarAlCarrito(${p.idProducto})">Agregar al Carrito</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar productos:", error);
            }
        }

        async function cargarCarrito() {
            try {
                const res = await fetch(`${API_URL}/carrito`);
                const items = await res.json();
                const tabla = document.getElementById('tabla-carrito');
                const totalElemento = document.getElementById('total-carrito');
                tabla.innerHTML = '';

                let totalAcumulado = 0;

                if (items.length === 0) {
                    tabla.innerHTML = '<tr><td colspan="4" class="text-center text-muted">El carrito está vacío</td></tr>';
                    totalElemento.innerText = '$0.00';
                    return;
                }

                items.forEach(i => {
                    const subtotal = Number(i.precio) * Number(i.cantidad);
                    totalAcumulado += subtotal;

                    tabla.innerHTML += `
                        <tr>
                            <td>${i.nombre}</td>
                            <td>$${Number(i.precio).toFixed(2)}</td>
                            <td>${i.cantidad}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" onclick="eliminarItem(${i.idShoppingCart})">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });

                totalElemento.innerText = `$${totalAcumulado.toFixed(2)}`;
            } catch (error) {
                console.error("Error al cargar el carrito:", error);
            }
        }

        async function agregarAlCarrito(idProducto) {
            await fetch(`${API_URL}/carrito`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idProducto: idProducto, codUsuario: 'USR001', cantidad: 1 })
            });
            cargarCarrito();
        }

        async function eliminarItem(id) {
            await fetch(`${API_URL}/carrito/${id}`, { method: 'DELETE' });
            cargarCarrito();
        }

        async function vaciarCarrito() {
            await fetch(`${API_URL}/carrito`, { method: 'DELETE' });
            cargarCarrito();
        }

        cargarProductos();
        cargarCarrito();
    </script>
</body>
</html>
